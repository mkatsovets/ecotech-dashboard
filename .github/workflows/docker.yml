# On every push to main: run the tests, build the image and publish it to Docker Hub:
#   docker.io/<DOCKERHUB_USERNAME>/ecotech-dashboard:latest  (+ a tag with the commit SHA)
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub login
#   DOCKERHUB_TOKEN     - an access token with Read & Write scope (hub.docker.com -> Account settings -> Security)
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt && pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecotech-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecotech-dashboard:${{ github.sha }}
